services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tailer_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailer}
      POSTGRES_USER: ${POSTGRES_USER:-tailer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tailer_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tailer_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tailer_network

  # Redis Cache and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: tailer_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tailer_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tailer_backend
    environment:
      # TAILER application settings (use TAILER_ prefix)
      TAILER_DATABASE_URL: ${TAILER_DATABASE_URL:-postgresql://tailer_user:tailer_password@postgres:5432/tailer}
      TAILER_REDIS_URL: ${TAILER_REDIS_URL:-redis://redis:6379}
      TAILER_FRONTEND_URL: ${TAILER_FRONTEND_URL:-http://localhost:3000}
      TAILER_SECRET_KEY: ${TAILER_SECRET_KEY:-your-secret-key-change-in-production}
      TAILER_JWT_SECRET_KEY: ${TAILER_JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      TAILER_JWT_ALGORITHM: ${TAILER_JWT_ALGORITHM:-HS256}
      TAILER_JWT_EXPIRATION_MINUTES: ${TAILER_JWT_EXPIRATION_MINUTES:-30}
      # External provider keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - tailer_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${TAILER_BACKEND_URL:-http://localhost:8000}
    container_name: tailer_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${TAILER_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tailer_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tailer_network:
    driver: bridge
